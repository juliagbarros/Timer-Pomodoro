<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="topo">
        <h1>Pomodoro</h1>
    </div>

    <div class="mensagem">
        <h1 id="mensagem"></h1>
    </div>


    <div class="container">

        <div class="timer">
            <h1 id="tempo">00:00</h1>
            <audio id="audio" src="notificacaoAudio.mp3"> </audio>
        </div>

            <div class="progresso">
                <div class="barra" id="barra">
                </div>
            </div>

        <div class="botoes">  
            <button type="button" onclick="iniciar()" > Iniciar </button>
            <button type="button" onclick="pausar()" >Pausar</button>
            <button type="button" onclick="zerar()">Zerar</button>
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
